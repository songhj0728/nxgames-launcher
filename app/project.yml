# Generated into NXLauncher.xcodeproj by tools/build_launcher.sh (XcodeGen fills ${BUNDLE_PREFIX} from config.sh)
name: NXLauncher
options:
  deploymentTarget:
    iOS: "26.0"
targets:
  NXLauncher:
    type: application
    platform: iOS
    sources:
      - Sources
      - Assets.xcassets
      - path: ../nxnative/dm/ios/Sources/LauncherSettings.swift   # the games' own settings model and rows, so the launcher draws a game's settings exactly as the game does
      - path: ../nxnative/dm/ios/Sources/LauncherRow.swift
    info:
      path: Gen/Info.plist
      properties:
        CFBundleDisplayName: NX Games
        CFBundleAllowMixedLocalizations: true   # each game framework shows its own name in the user's language (its lproj/InfoPlist.strings)
        UILaunchStoryboardName: ""
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UISupportedInterfaceOrientations~ipad: [UIInterfaceOrientationLandscapeRight, UIInterfaceOrientationLandscapeLeft]
        UIRequiresFullScreen: true
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: false
        LSApplicationCategoryType: public.app-category.games
        LSSupportsGameMode: true
        GCSupportsControllerUserInteraction: true
        GCSupportedGameControllers: [{ProfileName: ExtendedGamepad}]
        CADisableMinimumFrameDurationOnPhone: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default
                UISceneDelegateClassName: NXLScene
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.games
      PRODUCT_NAME: NXLauncher
      MARKETING_VERSION: "1.0"
      CURRENT_PROJECT_VERSION: "1"
      TARGETED_DEVICE_FAMILY: "1,2"
      CLANG_ENABLE_OBJC_ARC: YES
      LD_RUNPATH_SEARCH_PATHS: "@executable_path/Frameworks"
      GCC_C_LANGUAGE_STANDARD: gnu11
      SWIFT_VERSION: "5.0"
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
