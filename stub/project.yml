# An empty app with the launcher's bundle ID: building it makes Xcode fetch a provisioning profile, which tools/assemble.sh embeds
name: Stub
options: {deploymentTarget: {iOS: "26.0"}}
targets:
  Games:
    type: application
    platform: iOS
    sources: [S]
    info: {path: Info.plist, properties: {UILaunchStoryboardName: ""}}
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: ${BUNDLE_PREFIX}.games
      DEVELOPMENT_TEAM: ${TEAM_ID}
      CODE_SIGN_STYLE: Automatic
      CODE_SIGN_ENTITLEMENTS: ent.plist
